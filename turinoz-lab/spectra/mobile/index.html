<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spectra</title>
<meta name="description" content="Two seconds with a colour. Rebuild it from memory.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0b0b0c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// =============================================================================
// SPECTRA / Mobile — plain canvas build of the Rive script, for a Telegram Mini App.
// A run is three colours: READY → LOOK (2 s) → MIX → RESULT → REVEAL, ×3 → SUMMARY.
// SUMMARY shares a challenge link: same three colours, and the friend sees your guesses.
// =============================================================================

// Your bot's username without the @ (e.g. "spectra_colour_bot"). Challenge links open
// inside Telegram when this is set; left empty, they open this page in the browser.
const BOT_USERNAME = "colplaybot";
const RUN_LENGTH = 3;

const W = 390, H = 820;
const LOOK_SECONDS = 2.1, EXIT_SECONDS = 0.34;
const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

const L = {
  rx: 24, rw: 342,
  big:   { cx: 195, cy: 252, s: 282, r: 34 },
  pairA: { cx: 104, cy: 192, s: 160, r: 24 },
  pairB: { cx: 286, cy: 192, s: 160, r: 24 },
  pairLabel: 298, heading: 476,
  bar: { x: 56, y: 410, w: 278 },
  rowTop: 426, rowGap: 92, trackOffset: 26, trackH: 40, inset: 13,
  score: 402, driftTop: 466, driftGap: 56, diagTop: 650,
  seg: { x: 275, y: 24, w: 91, h: 42 },
  button: { cx: 195, cy: 756, h: 56, pad: 32, minW: 342 },
  card: { x: 22, y: 176, w: 292, h: 340, r: 28, dx: 18, dy: 22 },
  footer: 806,
  button2: { cx: 195, cy: 690, w: 342, h: 52 },
  sum: { label: 118, score: 196, rows: 290, rowH: 96 },
};
const FEEL = {
  soft: [170, 26], snap: [520, 40], bounce: [620, 26], glide: [900, 60], theme: [110, 21], count: [55, 14.8],
};
const DARK = {
  ground: [11, 11, 12], surface: [22, 22, 24], card: [27, 27, 30],
  ink: [246, 245, 242], muted: [130, 129, 123], faint: [74, 74, 71],
  chip: [255, 255, 255], onchip: [11, 11, 12], shadow: [0, 0, 0],
  ringA: 0.08, shadowA: 0.55, capA: 0.40,
};
const LIGHT = {
  ground: [241, 240, 235], surface: [255, 255, 255], card: [255, 255, 255],
  ink: [19, 19, 18], muted: [119, 118, 110], faint: [186, 185, 178],
  chip: [19, 19, 18], onchip: [255, 255, 255], shadow: [22, 22, 26],
  ringA: 0.08, shadowA: 0.20, capA: 0.22,
};
const COLOURS = [
  ["Crimson", 224, 49, 49], ["Scarlet", 235, 72, 54], ["Coral", 246, 124, 94],
  ["Rust", 176, 78, 36], ["Amber", 240, 168, 40], ["Ochre", 214, 158, 62],
  ["Lemon", 232, 214, 84], ["Sand", 212, 192, 154], ["Olive", 134, 142, 68],
  ["Moss", 104, 138, 62], ["Forest", 46, 108, 76], ["Emerald", 40, 172, 112],
  ["Mint", 122, 202, 166], ["Teal", 28, 150, 152], ["Cyan", 52, 184, 218],
  ["Azure", 58, 134, 236], ["Cobalt", 44, 76, 198], ["Indigo", 78, 68, 178],
  ["Violet", 124, 84, 226], ["Orchid", 172, 100, 198], ["Magenta", 210, 72, 152],
  ["Rose", 238, 106, 140], ["Plum", 112, 62, 96], ["Slate", 96, 110, 124],
];
const VERDICTS = [[0.90, "REMARKABLE"], [0.78, "SHARP"], [0.62, "CLOSE"], [0.42, "ROUGH"], [0, "WIDE"]];
const FAMILIES = [
  [0, "red"], [18, "vermilion"], [38, "orange"], [52, "amber"], [62, "yellow"],
  [80, "chartreuse"], [110, "green"], [150, "jade"], [175, "teal"], [195, "cyan"],
  [215, "azure"], [240, "blue"], [262, "indigo"], [282, "violet"], [305, "magenta"],
  [330, "rose"], [350, "crimson"],
];
const CARDS = { keep: 8, show: 4, fanDx: 24, fanDy: 30, fanRot: 3.5, throw: 70 };
const DEG = "°";

// ---- maths -------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const round = (v) => Math.floor(v + 0.5);
const mix3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
let GA = 1;
const col = (c, a = 1) => `rgba(${round(clamp(c[0], 0, 255))},${round(clamp(c[1], 0, 255))},${round(clamp(c[2], 0, 255))},${clamp(a * GA, 0, 1)})`;

function decode(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }
function lab(c) {
  const r = decode(c[0]), g = decode(c[1]), b = decode(c[2]);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
function accuracy(a, b) {
  const p = lab(a), q = lab(b);
  const d = Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
  return clamp(1 - d / 0.42, 0, 1) ** 0.85;
}
function hsb2rgb(h, s, v) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; v = clamp(v, 0, 100) / 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function rgb2hsb(c) {
  const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) {
    if (mx === r) h = 60 * ((((g - b) / d) % 6 + 6) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  return [((h % 360) + 360) % 360, mx > 0 ? d / mx * 100 : 0, mx * 100];
}
const hex = (c) => "#" + c.map((v) => round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("").toUpperCase();
function family(h) {
  h = ((h % 360) + 360) % 360;
  for (let i = FAMILIES.length - 1; i >= 0; i--) if (h >= FAMILIES[i][0]) return FAMILIES[i][1];
  return "red";
}

// ---- springs -------------------------------------------------------------------
const springs = [];
const newSpring = (x, p) => ({ x, v: 0, t: x, k: p[0], c: p[1] });
const spring = (x, p) => { const s = newSpring(x, p); springs.push(s); return s; };
function stepSpring(s, dt) {
  if (s.v === 0 && s.x === s.t) return;
  const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) { const a = s.k * (s.t - s.x) - s.c * s.v; s.v += a * h; s.x += s.v * h; }
  if (Math.abs(s.t - s.x) < 0.0005 && Math.abs(s.v) < 0.0005) { s.x = s.t; s.v = 0; }
}
const snap = (s, x) => { s.x = x; s.t = x; s.v = 0; };

// ---- Telegram ------------------------------------------------------------------
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const inTelegram = !!(tg && tg.initData);
function haptic(kind) {
  const h = tg && tg.HapticFeedback;
  try {
    if (h && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1")) {
      if (kind === "success" || kind === "warning" || kind === "error") h.notificationOccurred(kind);
      else if (kind === "select") h.selectionChanged();
      else h.impactOccurred(kind === "medium" ? "medium" : "light");
    } else if (navigator.vibrate) navigator.vibrate(kind === "error" ? [18, 40, 18] : 8);
  } catch (e) {}
}
function paintChrome(mode) {
  const c = mode === "light" ? "#f1f0eb" : "#0b0b0c";
  document.documentElement.style.setProperty("--bg", c);
  if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1")) {
    try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}
    try { tg.setBottomBarColor && tg.isVersionAtLeast("7.10") && tg.setBottomBarColor(c); } catch (e) {}
  }
}
function copyText(text) {
  let done = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).catch(fallback); done = true; } } catch (e) {}
  if (!done) fallback();
  function fallback() {
    try {
      const t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
    } catch (e) {}
  }
}

// ---- canvas ----------------------------------------------------------------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2; offY = (ch - H * scale) / 2;
}
window.addEventListener("resize", resize);
if (tg) try { tg.onEvent("viewportChanged", resize); } catch (e) {}

function font(size, weight) { return `${weight || 500} ${size}px ${FONT}`; }
function setSpacing(v) { try { ctx.letterSpacing = (v || 0) + "px"; } catch (e) {} }
function tw(value, size, track, weight) {
  ctx.font = font(size, weight); setSpacing(track);
  const w = ctx.measureText(value).width; setSpacing(0); return w;
}
function txt(value, x, y, size, c, a = 1, align = "left", track = 0, weight = 500) {
  if (a * GA <= 0.004) return;
  ctx.font = font(size, weight); setSpacing(track);
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col(c, a); ctx.fillText(value, x, y); setSpacing(0);
}
function wrap(value, size, maxW) {
  const words = value.split(" "), lines = []; let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (line && tw(t, size) > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); r = Math.max(0, Math.min(r, w / 2, h / 2));
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
}
function fillRR(x, y, w, h, r, c, a = 1) { rr(x, y, w, h, r); ctx.fillStyle = col(c, a); ctx.fill(); }
function ring(x, y, w, h, r, c, a, width = 1) { rr(x, y, w, h, r); ctx.strokeStyle = col(c, a); ctx.lineWidth = width; ctx.stroke(); }
function rect(x, y, w, h, c, a = 1) { ctx.fillStyle = col(c, a); ctx.fillRect(x, y, w, h); }
function dot(cx, cy, r, c, a = 1) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = col(c, a); ctx.fill(); }

// ---- state -------------------------------------------------------------------------
const S = {
  time: 0, stageTime: 0, stage: "ready", round: 0, played: 0, total: 0, lastPick: -1, best: 0,
  name: "", verdict: "", target: [128, 128, 128], guess: [128, 128, 128], score: 0,
  mode: "dark", queue: [], gen: 0,
  pointerId: null, pressed: "", pressedArg: 0, hover: "", hoverArg: 0, hoverRow: 0, grab: 0,
  downX: 0, downY: 0, dragging: false, dragDx: 0, dragDy: 0,
  cards: [], drift: null, diagLines: [], val: [200, 50, 60], max: [360, 100, 100],
  btnLabel: "", btnPrev: "",
};
S.themeT = spring(0, FEEL.theme);
S.segX = spring(L.seg.x + 47, FEEL.snap);
S.sunRot = spring(0, FEEL.soft);
S.moonRot = spring(0, FEEL.bounce);
S.segPress = [spring(1, FEEL.bounce), spring(1, FEEL.bounce)];
S.disp = []; S.rowA = []; S.rowHover = []; S.capScale = []; S.driftT = [];
for (let i = 0; i < 3; i++) {
  S.disp.push(spring(S.val[i], FEEL.glide)); S.rowA.push(spring(0, FEEL.soft));
  S.rowHover.push(spring(0, FEEL.soft)); S.capScale.push(spring(1, FEEL.bounce)); S.driftT.push(spring(0, FEEL.snap));
}
S.gIntro = spring(1, FEEL.soft); S.gLook = spring(0, FEEL.soft); S.gResult = spring(0, FEEL.soft);
S.scrim = spring(0, FEEL.soft); S.swapT = spring(0, FEEL.soft); S.lookSwap = spring(0, FEEL.soft);
S.scoreShown = spring(0, FEEL.count); S.diagA = spring(0, FEEL.soft); S.fanT = spring(0, FEEL.snap);
const block = (a) => ({ cx: spring(L.big.cx, FEEL.snap), cy: spring(L.big.cy, FEEL.snap), s: spring(L.big.s, FEEL.snap), r: spring(L.big.r, FEEL.snap), a: spring(a, FEEL.soft) });
S.A = block(1); S.B = block(0);
S.btnVis = spring(1, FEEL.soft); S.btnScale = spring(1, FEEL.bounce); S.btnSwap = spring(1, FEEL.soft); S.btnW = spring(0, FEEL.snap);
S.live = [spring(74, FEEL.soft), spring(74, FEEL.soft), spring(71, FEEL.soft)];
S.toast = spring(0, FEEL.soft); S.toastText = ""; S.toastUntil = -1;
S.pal = {};
S.gSummary = spring(0, FEEL.soft); S.btn2Vis = spring(0, FEEL.soft); S.btn2Scale = spring(1, FEEL.bounce);
S.sumRow = [spring(0, FEEL.snap), spring(0, FEEL.snap), spring(0, FEEL.snap)];
S.run = null; S.roundIdx = 0; S.challenge = null;

// ---- runs & challenges -------------------------------------------------------------
function randomPicks() {
  const bag = COLOURS.map((_, i) => i), out = [];
  while (out.length < RUN_LENGTH) out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
  return out;
}
function startRun(picks) { S.run = { picks, guesses: [], scores: [] }; S.roundIdx = 0; }
const avgOf = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const h2 = (n) => round(clamp(n, 0, 255)).toString(16).padStart(2, "0");
function b64url(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(s) {
  try {
    const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  } catch (e) { return ""; }
}
function myName() {
  const u = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user;
  return (u && (u.first_name || u.username)) || "";
}
function encodeRun() {
  const r = S.run;
  let p = "d" + r.picks.map(h2).join("") + r.guesses.map((g) => g.map(h2).join("")).join("");
  const n = Array.from(myName()).slice(0, 16).join("");
  if (n) p += "_" + b64url(n);
  return p;
}
function decodeRun(p) {
  const m = /^d([0-9a-f]{6})([0-9a-f]{18})(?:_([A-Za-z0-9_-]{1,120}))?$/.exec(p || "");
  if (!m) return null;
  const picks = [0, 1, 2].map((i) => parseInt(m[1].substr(i * 2, 2), 16));
  if (picks.some((i) => i >= COLOURS.length) || new Set(picks).size !== 3) return null;
  const guesses = [0, 1, 2].map((i) => [0, 1, 2].map((k) => parseInt(m[2].substr(i * 6 + k * 2, 2), 16)));
  const scores = picks.map((pi, i) => accuracy(guesses[i], COLOURS[pi].slice(1)));
  const name = (m[3] && unb64url(m[3]).trim()) || "A friend";
  return { picks, guesses, scores, name: Array.from(name).slice(0, 16).join("") };
}
function readChallenge() {
  let p = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (!p) { try { p = new URLSearchParams(location.search).get("c") || new URLSearchParams(location.search).get("tgWebAppStartParam"); } catch (e) {} }
  return decodeRun(p);
}
function shareRun() {
  const param = encodeRun();
  const link = BOT_USERNAME ? `https://t.me/${BOT_USERNAME}?startapp=${param}` : `${location.origin}${location.pathname}?c=${param}`;
  const pct = round(avgOf(S.run.scores) * 100);
  let text = `I scored ${pct}% on Spectra. Three colours, two seconds each. Beat me.`;
  if (S.challenge) {
    const d = pct - round(avgOf(S.challenge.scores) * 100);
    text = d > 0 ? `I beat ${S.challenge.name} on Spectra, ${pct}%. Your turn.` : `I scored ${pct}% on Spectra. Can you do better?`;
  }
  const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(text);
  if (inTelegram && tg.openTelegramLink) { try { tg.openTelegramLink(url); return; } catch (e) {} }
  if (navigator.share) { navigator.share({ text, url: link }).catch(() => {}); return; }
  copyText(text + " " + link); showToast("Link copied");
}

function later(delay, fn) { S.queue.push({ t: delay, fn, gen: S.gen }); }
function clearQueue() { S.gen++; S.queue = []; }
const trackTop = (i) => L.rowTop + i * L.rowGap + L.trackOffset;

function setButton(label, instant) {
  if (label === S.btnLabel) return;
  S.btnPrev = S.btnLabel; S.btnLabel = label;
  const w = Math.max(tw(label, 16, 0, 600) + L.button.pad * 2, L.button.minW);
  if (instant || S.btnVis.x < 0.05) { snap(S.btnSwap, 1); snap(S.btnW, w); S.btnPrev = ""; }
  else { snap(S.btnSwap, 0); S.btnSwap.t = 1; S.btnW.t = w; }
}
function setTheme(mode, instant) {
  if (mode === S.mode) return;
  S.mode = mode;
  if (mode === "light") { S.themeT.t = 1; S.segX.t = L.seg.x + 4; S.sunRot.t += 90; }
  else { S.themeT.t = 0; S.segX.t = L.seg.x + 47; S.moonRot.v -= 320; }
  if (instant) { snap(S.themeT, S.themeT.t); snap(S.segX, S.segX.t); }
  paintChrome(mode);
}

function newRound() {
  clearQueue();
  const fromReady = S.stage === "ready";
  if (!S.run) startRun(randomPicks());
  if (S.roundIdx === 0) S.cards = [];
  const c = COLOURS[S.run.picks[S.roundIdx]];
  S.name = c[0]; S.target = [c[1], c[2], c[3]];
  S.round = S.roundIdx + 1; S.stage = "look"; S.stageTime = 0;
  S.gSummary.t = 0; S.btn2Vis.t = 0;
  S.val = [200, 50, 60];
  for (let i = 0; i < 3; i++) { snap(S.disp[i], S.val[i]); S.rowA[i].t = 0; }
  const A = S.A, big = L.big;
  if (fromReady) { S.lookSwap.t = 1; A.s.v = -420; }
  else {
    snap(A.cx, big.cx); snap(A.cy, big.cy); snap(A.r, big.r);
    snap(A.s, 250); A.s.t = big.s; snap(A.a, 0); A.a.t = 1; snap(S.lookSwap, 1);
  }
  S.B.a.t = 0;
  S.gIntro.t = 0; S.gLook.t = 1; S.gResult.t = 0; S.scrim.t = 0; S.btnVis.t = 0;
  snap(S.swapT, 0);
}
function toMix() {
  clearQueue();
  S.stage = "mix"; S.stageTime = 0; S.gLook.t = 0; S.swapT.t = 1;
  for (let i = 0; i < 3; i++) later(0.05 + 0.07 * i, () => { S.rowA[i].t = 1; });
  setButton("Lock it");
  later(0.18, () => { S.btnVis.t = 1; });
}
function buildDrift() {
  const you = rgb2hsb(S.guess), tru = rgb2hsb(S.target);
  const dh = ((you[0] - tru[0] + 540) % 360) - 180, ds = you[1] - tru[1], db = you[2] - tru[2];
  const label = (d, u) => { d = round(d); if (d === 0) return "exact"; return (d > 0 ? "+" : "") + d + u; };
  const hueStops = []; for (let k = 0; k <= 12; k++) hueStops.push([k / 12, hsb2rgb(k * 30, 70, 92)]);
  S.drift = [

  rr(-3 * k, -3 * k, 11 * k, 11 * k, 2.6 * k); ctx.fillStyle = col([255, 255, 255], 0.95 * a); ctx.fill(); ctx.stroke();

function drawCard(P, c) {
  const a = c.a.x; if (a < 0.004) return;
  GA = a;
  const C = L.card, s = c.s.x, rot = c.rot.x * Math.PI / 180;
  const cx = c.x.x + C.w / 2, cy = c.y.x + c.lift.x + C.h / 2;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-C.w / 2, -C.h / 2);

  ctx.save();
  ctx.shadowColor = col(P.shadow, P.shadowA);
  ctx.shadowBlur = 44 * scale * dpr; ctx.shadowOffsetY = (18 - c.lift.x * 0.8) * scale * dpr;
  fillRR(0, 0, C.w, C.h, C.r, P.card, 1);
  ctx.restore();
  ring(0.5, 0.5, C.w - 1, C.h - 1, C.r, P.ink, P.ringA);

  const grad = ctx.createLinearGradient(100, 13, 190, 265);
  grad.addColorStop(0, col(c.rgb)); grad.addColorStop(0.12, col(c.rgb)); grad.addColorStop(1, col(c.shade));
  rr(13, 13, C.w - 26, 252, 19); ctx.fillStyle = grad; ctx.fill();

  // copy badge
  const bs = c.badgeS.x, bcx = C.w - 42, bcy = 42;
  fillRR(bcx - 17 * bs, bcy - 17 * bs, 34 * bs, 34 * bs, 11 * bs, [255, 255, 255], 0.84);
  const ink = [22, 22, 26], t = clamp(c.copyT.x, 0, 1);
  ctx.save(); ctx.translate(bcx, bcy);
  if (t < 0.99) drawCopyIcon(ink, 1 - t, bs * (1 - 0.35 * t));
  if (c.copyT.x > 0.01) {
    const k = bs * (0.55 + 0.45 * c.copyT.x);
    ctx.beginPath(); ctx.moveTo(-7 * k, 0.6 * k); ctx.lineTo(-2.6 * k, 5 * k); ctx.lineTo(7 * k, -4.6 * k);
    ctx.strokeStyle = col(ink, t); ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
  }
  ctx.restore();

  txt(c.name, 24, 298, 18, P.ink, 1, "left", -0.2, 700);
  txt(c.hexText, 24, 319, 12.5, P.muted);
  const chipX = C.w - 22 - c.chipW;
  fillRR(chipX, 283, c.chipW, 38, 19, P.chip, 1);
  fillRR(chipX + 15, 296, 12, 12, 4, c.rgb, 1);
  txt(c.chip, chipX + 34, 306.6, 13, P.onchip, 1, "left", 0, 600);
  ctx.restore();
}
function drawSun(c, rotDeg, sc) {
  ctx.save(); ctx.rotate(rotDeg * Math.PI / 180); ctx.scale(sc, sc);
  ctx.strokeStyle = col(c); ctx.lineWidth = 1.5 / sc; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 7.3, Math.sin(a) * 7.3); ctx.lineTo(Math.cos(a) * 9.5, Math.sin(a) * 9.5); ctx.stroke();
  }
  ctx.restore();
}
function drawMoon(c, rotDeg, sc) {
  ctx.save(); ctx.rotate(rotDeg * Math.PI / 180); ctx.scale(sc, sc);
  ctx.strokeStyle = col(c); ctx.lineWidth = 1.5 / sc; ctx.lineJoin = "round";
  // crescent: outer disc minus a bite at the upper right
  const r1 = 7.8, bx = 4.4, by = -4.4, r2 = 6.4, d = Math.hypot(bx, by);
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const mx = bx * a / d, my = by * a / d, px = -by / d, py = bx / d;
  const p1 = [mx + h * px, my + h * py], p2 = [mx - h * px, my - h * py];
  const t1 = Math.atan2(p1[1], p1[0]), t2 = Math.atan2(p2[1], p2[0]);
  const f1 = Math.atan2(p1[1] - by, p1[0] - bx), f2 = Math.atan2(p2[1] - by, p2[0] - bx);
  ctx.beginPath(); ctx.arc(0, 0, r1, t1, t2, false); ctx.arc(bx, by, r2, f2, f1, true); ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawHeader(P) {
  GA = 1;
  const pulse = 1 + 0.18 * (0.5 + 0.5 * Math.sin(S.time * 5.2)) * S.gLook.x;
  fillRR(29 - 5 * pulse, 37 - 5 * pulse, 10 * pulse, 10 * pulse, 3 * pulse, [S.live[0].x, S.live[1].x, S.live[2].x], 1);
  txt("Spectra", 44, 45.5, 22, P.ink, 1, "left", -0.4, 700);
  const sub = S.stage === "summary" ? "RESULTS" : "ROUND " + Math.max(1, S.round) + " / " + RUN_LENGTH;
  txt(sub, 24, 70, 12, P.muted, 1, "left", 0.8, 600);
  if (S.challenge) txt("VS " + S.challenge.name.toUpperCase(), 24 + tw(sub, 12, 0.8, 600) + 16, 70, 12, P.ink, 1, "left", 0.8, 600);

  const sg = L.seg;
  fillRR(sg.x, sg.y, sg.w, sg.h, sg.h / 2, P.surface, 1);
  ring(sg.x + 0.5, sg.y + 0.5, sg.w - 1, sg.h - 1, sg.h / 2, P.ink, P.ringA);
  fillRR(S.segX.x, sg.y + 4, 40, 34, 17, P.chip, 1);
  const slots = [sg.x + 4, sg.x + 47], names = ["light", "dark"];
  for (let i = 0; i < 2; i++) {
    const on = clamp(1 - Math.abs(S.segX.x - slots[i]) / 43, 0, 1);
    const c = mix3(P.muted, P.onchip, on);
    const sc = S.segPress[i].x * 17 / 24;
    ctx.save(); ctx.translate(slots[i] + 20, sg.y + 21);
    if (i === 0) drawSun(c, S.sunRot.x, sc); else drawMoon(c, S.moonRot.x, sc);
    ctx.restore();
  }
  txt("TURINOZ", 24, L.footer, 11.5, P.muted, 1, "left", 0.9, 600);
  txt("OKLAB SCORED", W - 24, L.footer, 11.5, P.muted, 1, "right", 0.9, 600);
}
function drawButton(P) {
  const v = S.btnVis.x; if (v <= 0.004) return;
  GA = v;
  const b = L.button, w = Math.max(b.h, S.btnW.x), sc = S.btnScale.x;
  ctx.save();
  ctx.translate(b.cx, b.cy + (1 - v) * 10); ctx.scale(sc, sc); ctx.translate(-w / 2, -b.h / 2);
  rr(0, 0, w, b.h, b.h / 2); ctx.fillStyle = col(P.chip); ctx.fill(); ctx.clip();
  const sw = S.btnSwap.x, base = b.h / 2 + 5.8;
  if (sw < 0.999 && S.btnPrev) txt(S.btnPrev, w / 2, base - 8 * sw, 16, P.onchip, 1 - sw, "center", 0, 600);
  txt(S.btnLabel, w / 2, base + 8 * (1 - sw), 16, P.onchip, sw, "center", 0, 600);
  ctx.restore();
}
function drawSummary(P) {
  const g = S.gSummary.x; if (g <= 0.004 || !S.run || S.run.scores.length < RUN_LENGTH) return;
  GA = g;
  const Z = L.sum, rx = L.rx, rw = L.rw, ch = S.challenge;
  ctx.save(); ctx.translate(0, (1 - g) * 14);
  const mine = round(S.scoreShown.x * 100);
  if (ch) {
    const theirs = round(avgOf(ch.scores) * 100), finalMine = round(avgOf(S.run.scores) * 100), d = finalMine - theirs;
    const head = d > 0 ? "You win" : d < 0 ? ch.name + " wins" : "Dead heat";
    txt(head.toUpperCase(), rx, Z.label, 12, P.muted, 1, "left", 0.8, 600);
    txt(mine + "%", rx, Z.score, 72, P.ink, 1, "left", -2.5, 700);
    txt(theirs + "%", rx + rw, Z.score, 72, P.muted, 1, "right", -2.5, 700);
    txt("YOU", rx, Z.score + 28, 12, P.muted, 1, "left", 0.8, 600);
    txt(ch.name.toUpperCase(), rx + rw, Z.score + 28, 12, P.muted, 1, "right", 0.8, 600);
  } else {
    txt("THREE COLOURS", rx, Z.label, 12, P.muted, 1, "left", 0.8, 600);
    txt(mine + "%", rx, Z.score, 80, P.ink, 1, "left", -3, 700);
    let verdict = VERDICTS[VERDICTS.length - 1][1];
    for (const v of VERDICTS) if (avgOf(S.run.scores) >= v[0]) { verdict = v[1]; break; }
    txt(verdict, rx + rw, Z.score, 14, P.muted, 1, "right", 0.8, 600);
  }
  rect(rx, Z.rows - 22, rw, 1, P.ink, P.ringA * 1.4);

  // column heads
  const colX = ch ? [rx + rw - 124, rx + rw - 48] : [rx + rw - 48];
  const heads = ch ? ["YOU", Array.from(ch.name.toUpperCase()).slice(0, 7).join("")] : ["YOU"];
  heads.forEach((h, k) => txt(h, colX[k] + 24, Z.rows - 2, 10.5, P.muted, 1, "center", 0.8, 600));

  for (let i = 0; i < RUN_LENGTH; i++) {
    const t = S.sumRow[i].x; if (t <= 0.004) continue;
    GA = g * clamp(t, 0, 1);
    const top = Z.rows + 14 + i * Z.rowH + (1 - t) * 12;
    const c = COLOURS[S.run.picks[i]], rgb = c.slice(1);
    fillRR(rx, top, 72, 72, 18, rgb, 1); ring(rx + 0.5, top + 0.5, 71, 71, 18, P.ink, P.ringA);
    txt(c[0], rx + 88, top + 32, 18, P.ink, 1, "left", -0.2, 700);
    txt(hex(rgb), rx + 88, top + 53, 12.5, P.muted);
    const cols = ch ? [[S.run.guesses[i], S.run.scores[i]], [ch.guesses[i], ch.scores[i]]] : [[S.run.guesses[i], S.run.scores[i]]];
    cols.forEach(([gc, sc], k) => {
      const x = colX[k];
      fillRR(x, top + 4, 48, 40, 12, gc, 1); ring(x + 0.5, top + 4.5, 47, 39, 12, P.ink, P.ringA);
      const win = ch && ((k === 0 && sc > cols[1][1]) || (k === 1 && sc > cols[0][1]));
      txt(round(sc * 100) + "%", x + 24, top + 66, 14, win || !ch ? P.ink : P.muted, 1, "center", 0, win ? 700 : 600);
    });
  }
  ctx.restore();
}
function drawButton2(P) {
  const v = S.btn2Vis.x; if (v <= 0.004) return;
  GA = v;
  const b = L.button2, sc = S.btn2Scale.x;
  ctx.save(); ctx.translate(b.cx, b.cy + (1 - v) * 10); ctx.scale(sc, sc);
  ring(-b.w / 2 + 0.75, -b.h / 2 + 0.75, b.w - 1.5, b.h - 1.5, b.h / 2, P.ink, 0.22, 1.5);
  txt("Play again", 0, 5.8, 16, P.ink, 1, "center", 0, 600);
  ctx.restore();
}
function drawToast(P) {
  const a = S.toast.x; if (a <= 0.004 || !S.toastText) return;
  GA = a;
  const w = tw(S.toastText, 13.5, 0, 600) + 32, y = L.card.y - 64 + (1 - a) * 8;
  fillRR(W / 2 - w / 2, y, w, 34, 17, P.chip, 1);
  txt(S.toastText, W / 2, y + 22, 13.5, P.onchip, 1, "center", 0, 600);
}
function draw() {
  const P = S.pal;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  GA = 1;
  ctx.fillStyle = col(P.ground); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);

  drawLeft(P);
  if (S.challenge) drawHeading(P, S.gIntro.x, "Challenge", S.challenge.name + " scored " + round(avgOf(S.challenge.scores) * 100) + "% on three colours.", "Same colours, same two seconds. Beat it.");
  else drawHeading(P, S.gIntro.x, "Ready", "Three colours, two seconds each.", "Rebuild each one from memory.");
  drawHeading(P, S.gLook.x, "Look", "Hold it in your eye. In a moment", "you rebuild it from nothing.");
  drawRails(P);
  drawResult(P);
  const sa = S.scrim.x;
  if (sa > 0.004) { GA = sa; rect(-offX / scale, -offY / scale, canvas.width / dpr / scale + 2, canvas.height / dpr / scale + 2, P.ground, 0.93); }
  for (const c of S.cards) drawCard(P, c);
  drawSummary(P);
  drawHeader(P);
  drawButton2(P);
  drawButton(P);
  drawToast(P);
  GA = 1;
  const bg = hex(P.ground);
  if (document.documentElement.style.getPropertyValue("--bg") !== bg) document.documentElement.style.setProperty("--bg", bg);
}

// ---- boot ------------------------------------------------------------------------------
updatePalette();
resize();
S.challenge = readChallenge();
if (S.challenge) startRun(S.challenge.picks.slice());
setButton(S.challenge ? "Accept" : "Start", true);
const startMode = (tg && tg.colorScheme) || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
if (startMode === "light") setTheme("light", true); else paintChrome("dark");
if (tg) try { tg.onEvent("themeChanged", () => setTheme(tg.colorScheme === "light" ? "light" : "dark")); } catch (e) {}

let last = performance.now();
function frame(now) {
  advance((now - last) / 1000); last = now;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
